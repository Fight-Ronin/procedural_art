<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>procedural art</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b0d;
        --fg: #e8e6e3;
        --dim: rgba(232, 230, 227, 0.44);
        --line: rgba(232, 230, 227, 0.13);
        --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--fg); }
      body {
        font: 13px/1.6 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
        padding: 48px clamp(20px, 5vw, 64px) 96px;
      }

      header { display: flex; align-items: baseline; gap: 16px; margin-bottom: 40px; }
      h1 { font: 500 15px/1 var(--mono); letter-spacing: 0.08em; margin: 0; }
      header .count { color: var(--dim); font: 11px/1 var(--mono); }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: clamp(20px, 3vw, 40px);
        align-items: start;
      }

      a.card { display: block; color: inherit; text-decoration: none; }
      .frame {
        background: rgba(255, 255, 255, 0.028);
        border: 1px solid var(--line);
        overflow: hidden;
      }
      .frame img { display: block; width: 100%; height: auto; }
      a.card:hover .frame { border-color: rgba(232, 230, 227, 0.42); }

      /* A piece with no thumb.png yet: say so, and say what to run. */
      .missing {
        aspect-ratio: 1 / 1;
        display: grid; place-content: center; gap: 8px; text-align: center;
        padding: 20px; color: var(--dim); font: 10px/1.7 var(--mono);
      }

      .meta { padding-top: 12px; display: flex; align-items: baseline; gap: 10px; }
      .id { font: 11px/1.4 var(--mono); color: var(--dim); }
      .title { font-size: 14px; }
      .sub {
        padding-top: 3px; color: var(--dim);
        font: 10px/1.6 var(--mono); letter-spacing: 0.02em;
      }
      footer {
        margin-top: 72px; padding-top: 20px; border-top: 1px solid var(--line);
        color: var(--dim); font: 11px/1.8 var(--mono);
      }
      footer code { color: var(--fg); }
    </style>
  </head>
  <body>
    <header>
      <h1>procedural art</h1>
      <span class="count" id="count"></span>
    </header>
    <div class="grid" id="grid"></div>
    <footer id="footer"></footer>
    <script type="module" src="/visualization/gallery.ts"></script>
  </body>
</html>
